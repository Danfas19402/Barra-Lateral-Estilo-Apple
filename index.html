<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Lateral Estilo Apple</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<!-- 1º Algoritmo - Logo (Apple) -->
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">
                <i class="fab fa-apple"></i>
            </div>

            <!-- 2º Algoritmo - Menu Home -->
            <nav class="menu">
                <ul>
                    <li class="active">
                        <a href="#">
                            <i class="fas fa-home"></i>
                            <span>Lar</span>
                        </a>
                    </li>

                    <!-- 3º Algoritmo - Menu Explore -->
                    <li>
                        <a href="#">
                            <i class="fas fa-compass"></i>
                            <span>Explorar</span>
                        </a>
                    </li>

                    <!-- 4º Algoritmo - Menu Analytics -->
                    <li>
                        <a href="#">
                            <i class="fas fa-chart-simple"></i>
                            <span>Análises</span>
                        </a>
                    </li>

                    <!-- 5º Algoritmo - Menu Messages -->
                    <li>
                        <a href="#">
                            <i class="fas fa-message"></i>
                            <span>Mensagens</span>
                        </a>
                    </li>

                    <!-- 6º Algoritmo - Menu Projects-->
                    <li>
                        <a href="#">
                            <i class="fas fa-folder"></i>
                            <span>Projetos</span>
                        </a>
                    </li>

                    <!-- 7º Algoritmo - Menu Bookmarks -->
                    <li>
                        <a href="#">
                            <i class="fas fa-bookmark"></i>
                            <span>Favoritos</span>
                        </a>
                    </li>
                </ul>

            <!-- 8º Algortimo - Foto -->
            </nav>
            <div class="profile">
                <div class="avatar">
                    <img src="img/Foto minha - azul.jpg" alt="Minha Foto">
                </div>

                <!-- 9º Algoritmo - Meu Nome e Profissão -->
                <div class="user-info">
                    <h3>Daniel Fealsi</h3>
                    <p>Desenvolvedor Web</p>
                </div>
            </div>

        <!-- 10º Algoritmo - Saudação e Estatísticas -->    
        </aside>
        <main class="content">
            <header>
                <h1>Bem-vindo de volta, Daniel Fealsi</h1>
                <p>Confira as estatísticas do seu projeto para hoje.</p>
            </header>

            <!-- 11º Algoritmo - 1º Card -->
            <div class="card-container">
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>

                    <!-- 12 Algoritmo - Número 12 e Tarefas Concluídas -->
                    <div class="card-info">
                        <h3>12</h3>
                        <p>Tarefas concluídas</p>
                    </div>
                </div>

                <!-- 13º Algoritmo - 2º Card -->
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-clock"></i>
                    </div>

                    <!-- 14º Algoritmo - Número 5 e Tarefas Pendentes  -->
                    <div class="card-info">
                        <h3>5</h3>
                        <p>Tarefas Pendentes</p>
                    </div>
                </div>

                <!-- 15º Algoritmo - 3º Card -->
                <div class="card">
                    <div class="card-icon">
                        <i class="fas fa-users"></i>
                    </div>

                    <!-- 16 Algoritmo - Número 7 e Projetos Ativos -->
                    <div class="card-info">
                        <h3>7</h3>
                        <p>Projetos Ativos</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
